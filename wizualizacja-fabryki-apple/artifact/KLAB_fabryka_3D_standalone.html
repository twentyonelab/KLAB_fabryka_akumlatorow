  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"67a03df4-afe4-4de3-b7bb-39fd20df8c32\"><\u002Fscript>\n\n\n\n\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n  <style>@charset \"UTF-8\";\n/* ============================================================\n   21zmysłów — Colors & Type tokens\n   ------------------------------------------------------------\n   Derived from the 21zmyslow.pl marketing site (Apr 2026).\n   Polish characters: ą ć ę ł ń ó ś ź ż\n   ============================================================ */\n\n/* ----- FONTS ----- */\n/* Display / UI / Body: Space Grotesk (local brand font files in /fonts). */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 300;\n  font-display: swap;\n  src: url(\"7dfdf9fb-5b04-4417-a87d-31d75f34accc\") format('truetype');\n}\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"884a3853-ef3f-4f81-af41-4505885fd20f\") format('truetype');\n}\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"f7506b4c-180b-4676-b500-e9f242294b95\") format('truetype');\n}\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"e10f71e0-ffa7-48fb-b478-8e4d27974585\") format('truetype');\n}\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"5a2d9424-53e1-4584-a2d9-fdea47783d59\") format('truetype');\n}\n\n:root {\n  /* ---------- Palette: Neutrals (light theme primary) ---------- */\n  --c-white:        #FFFFFF;\n  --c-paper:        #FAFAF9;     /* page background — warm off-white */\n  --c-bone:         #F2F1EE;     /* card / secondary surface */\n  --c-mist:         #E6E5E1;     /* borders / dividers */\n  --c-stone:        #B7B5B0;     /* disabled text, hairlines */\n  --c-graphite:     #6B6B6B;     /* secondary text */\n  --c-ink:          #2B2A2E;     /* body text */\n  --c-carbon:       #111013;     /* headlines, logo ink */\n  --c-black:        #000000;\n\n  /* ---------- Palette: Signal Orange (brand accent) ---------- */\n  /* Sampled from the nav dot / full-stop accent: ~#FF6110 */\n  --c-ember-50:     #FFF1E8;\n  --c-ember-100:    #FFD9BF;\n  --c-ember-300:    #FFA36B;\n  --c-ember-500:    #FF6110;     /* ⭑ primary accent */\n  --c-ember-600:    #E8530A;\n  --c-ember-700:    #B43E05;\n\n  /* ---------- Palette: Categories ---------- */\n  /* Categories are not color-coded. They are typographic only and rely on\n     the same neutral + accent tokens as the rest of the system.\n     (Removed per brand feedback — kategorie nie mają kolorów.) */\n\n  /* ---------- Semantic roles (light) ---------- */\n  --bg:             var(--c-paper);\n  --bg-raised:      var(--c-white);\n  --bg-sunken:      var(--c-bone);\n  --bg-invert:      var(--c-carbon);\n\n  --fg:             var(--c-carbon);\n  --fg-2:           var(--c-ink);\n  --fg-3:           var(--c-graphite);\n  --fg-4:           var(--c-stone);\n  --fg-invert:      var(--c-paper);\n\n  --line:           var(--c-mist);\n  --line-strong:    var(--c-stone);\n\n  --accent:         var(--c-ember-500);\n  --accent-hover:   var(--c-ember-600);\n  --accent-soft:    var(--c-ember-50);\n  --on-accent:      var(--c-white);\n\n  /* ---------- Typography ---------- */\n  --font-display:   'Space Grotesk', ui-sans-serif, system-ui, -apple-system, sans-serif;\n  --font-body:      'Space Grotesk', ui-sans-serif, system-ui, -apple-system, sans-serif;\n  --font-mono:      ui-monospace, 'SF Mono', Menlo, Consolas, monospace;\n\n  /* Fluid type scale — 21zmysłów leans heavy with large, quiet breathing room */\n  --fs-hero:        clamp(3.5rem, 7vw, 6.75rem);   /* 56 → 108 */\n  --fs-h1:          clamp(2.5rem, 5vw, 4.5rem);    /* 40 → 72  */\n  --fs-h2:          clamp(2rem, 3.5vw, 3rem);      /* 32 → 48  */\n  --fs-h3:          clamp(1.5rem, 2vw, 2rem);      /* 24 → 32  */\n  --fs-lead:        1.25rem;                        /* 20 */\n  --fs-body:        1rem;                           /* 16 */\n  --fs-small:       0.875rem;                       /* 14 */\n  --fs-micro:       0.75rem;                        /* 12 — eyebrow caps */\n\n  --lh-tight:       1.02;\n  --lh-heading:     1.08;\n  --lh-body:        1.55;\n  --lh-ui:          1.3;\n\n  --tr-tight:       -0.025em;    /* heavy display (Space Grotesk 700) */\n  --tr-snug:        -0.01em;     /* sub-heads */\n  --tr-wide:        0.12em;      /* eyebrow caps */\n\n  /* ---------- Spacing scale (4-pt grid, loose) ---------- */\n  --sp-1:   4px;\n  --sp-2:   8px;\n  --sp-3:   12px;\n  --sp-4:   16px;\n  --sp-5:   24px;\n  --sp-6:   32px;\n  --sp-7:   48px;\n  --sp-8:   64px;\n  --sp-9:   96px;\n  --sp-10:  128px;\n  --sp-11:  160px;   /* section rhythm — site uses generous vertical air */\n\n  /* ---------- Radii ---------- */\n  --r-xs:   2px;\n  --r-sm:   4px;\n  --r-md:   8px;\n  --r-lg:   12px;\n  --r-xl:   20px;\n  --r-2xl:  21px;    /* portfolio tiles (brand signature — 21) */\n  --r-pill: 999px;\n\n  /* ---------- Shadows (restrained — the brand is flat) ---------- */\n  --shadow-sm:  0 1px 2px rgba(17,16,19,0.04), 0 1px 1px rgba(17,16,19,0.03);\n  --shadow-md:  0 4px 12px rgba(17,16,19,0.06), 0 2px 4px rgba(17,16,19,0.04);\n  --shadow-lg:  0 12px 32px rgba(17,16,19,0.10), 0 4px 8px rgba(17,16,19,0.04);\n  --shadow-pill:0 2px 8px rgba(17,16,19,0.08);\n\n  /* ---------- Motion ---------- */\n  --ease-standard:  cubic-bezier(0.22, 1, 0.36, 1);   /* gentle out-quart */\n  --ease-soft:      cubic-bezier(0.4, 0, 0.2, 1);\n  --dur-fast:       160ms;\n  --dur-base:       240ms;\n  --dur-slow:       480ms;\n}\n\n/* ---------- Dark theme ---------- */\n[data-theme=\"dark\"] {\n  --bg:             var(--c-carbon);\n  --bg-raised:      #1A1920;\n  --bg-sunken:      #0B0B0E;\n  --bg-invert:      var(--c-paper);\n\n  --fg:             var(--c-paper);\n  --fg-2:           #D6D5D1;\n  --fg-3:           #9B9A95;\n  --fg-4:           #57565B;\n  --fg-invert:      var(--c-carbon);\n\n  --line:           #2A292F;\n  --line-strong:    #3D3C43;\n\n  --accent-soft:    rgba(255,97,16,0.12);\n\n  --shadow-sm:  0 1px 2px rgba(0,0,0,0.40);\n  --shadow-md:  0 4px 12px rgba(0,0,0,0.45);\n  --shadow-lg:  0 12px 32px rgba(0,0,0,0.55);\n  --shadow-pill:0 2px 8px rgba(0,0,0,0.40);\n}\n\n/* ============================================================\n   SEMANTIC TYPE CLASSES\n   ============================================================ */\n\n.t-hero,\nh1.t-hero {\n  font-family: var(--font-display);\n  font-weight: 700;\n  font-size: var(--fs-hero);\n  line-height: var(--lh-tight);\n  letter-spacing: var(--tr-tight);\n  color: var(--fg);\n}\n\nh1, .t-h1 {\n  font-family: var(--font-display);\n  font-weight: 700;\n  font-size: var(--fs-h1);\n  line-height: var(--lh-heading);\n  letter-spacing: var(--tr-tight);\n  color: var(--fg);\n}\n\nh2, .t-h2 {\n  font-family: var(--font-display);\n  font-weight: 700;\n  font-size: var(--fs-h2);\n  line-height: var(--lh-heading);\n  letter-spacing: var(--tr-snug);\n  color: var(--fg);\n}\n\nh3, .t-h3 {\n  font-family: var(--font-display);\n  font-weight: 600;\n  font-size: var(--fs-h3);\n  line-height: var(--lh-heading);\n  letter-spacing: var(--tr-snug);\n  color: var(--fg);\n}\n\n.t-lead {\n  font-family: var(--font-body);\n  font-weight: 400;\n  font-size: var(--fs-lead);\n  line-height: var(--lh-body);\n  color: var(--fg-2);\n}\n\np, .t-body {\n  font-family: var(--font-body);\n  font-weight: 400;\n  font-size: var(--fs-body);\n  line-height: var(--lh-body);\n  color: var(--fg-2);\n}\n\n.t-small {\n  font-family: var(--font-body);\n  font-size: var(--fs-small);\n  line-height: var(--lh-ui);\n  color: var(--fg-3);\n}\n\n.t-eyebrow,\n.t-caps {\n  font-family: var(--font-body);\n  font-weight: 500;\n  font-size: var(--fs-micro);\n  line-height: 1;\n  letter-spacing: var(--tr-wide);\n  text-transform: uppercase;\n  color: var(--fg-3);\n}\n\ncode, .t-mono {\n  font-family: var(--font-mono);\n  font-size: 0.9375em;\n}\n\n/* Signature accent: orange full-stop at end of headings */\n.t-stop::after {\n  content: \".\";\n  color: var(--accent);\n}\n<\u002Fstyle>\n  <script src=\"e668e84c-74c0-4a8e-b494-d027423fd793\"><\u002Fscript>\n  <script>\n    (function () {\n      function seq(list, i) {\n        if (i >= list.length) return;\n        var s = document.createElement('script');\n        s.src = (window.__resources && window.__resources[list[i]]) || list[i];\n        s.onload = function () { seq(list, i + 1); };\n        document.head.appendChild(s);\n      }\n      seq(['threeJs', 'orbitJs', 'css2dJs', 'factoryJs'], 0);\n    })();\n  <\u002Fscript>\n  <style>\n    html, body { margin: 0; height: 100%; overflow: hidden; background: #DCDBD6; }\n    a { color: #111013; }\n    a:hover { color: #FF6110; }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div data-screen-label=\"Fabryka KLAB 3D\" data-theme=\"{{ themeName }}\" style=\"position: fixed; inset: 0; background: var(--bg); font-family: 'Space Grotesk', sans-serif; color: var(--fg);\">\n\n  <x-import component-from-global-scope=\"factory-3d\" show-labels=\"{{ showLabelsStr }}\" flow-speed=\"{{ flowSpeedStr }}\" auto-rotate=\"{{ autoRotateStr }}\" theme=\"{{ themeName }}\" show-flows=\"{{ showFlowsStr }}\" style=\"position: absolute; inset: 0;\" hint-size=\"100%,100%\"><\u002Fx-import>\n\n  <!-- Tytuł -->\n  <div style=\"position: absolute; top: 28px; left: 32px; max-width: 560px; pointer-events: none;\">\n    <div style=\"font-size: 11px; font-weight: 600; letter-spacing: 1.8px; text-transform: uppercase; color: var(--fg-3); margin-bottom: 8px;\">KLAB — schemat fabryki<\u002Fdiv>\n    <h1 style=\"margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; color: var(--fg);\">Fabryka z zamkniętą pętlą surowcową<span style=\"color: var(--accent);\">.<\u002Fspan><\u002Fh1>\n    <p style=\"margin: 10px 0 0; font-size: 13px; line-height: 1.55; color: var(--fg-3); max-width: 460px; text-wrap: pretty;\">Kompozytowe ogniwa ołowiowo-węglowe z linią recyklingu zużytych akumulatorów — 20&nbsp;t/d → 454&nbsp;MWh/rok. Kliknij stację, aby zobaczyć opis i bilans masy.<\u002Fp>\n  <\u002Fdiv>\n\n  <!-- Legenda -->\n  <div style=\"position: absolute; top: 28px; right: 28px; width: 224px; background: var(--bg-raised); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; box-shadow: 0 8px 28px rgba(17,16,19,0.10);\">\n    <div style=\"font-size: 10px; font-weight: 600; letter-spacing: 1.6px; text-transform: uppercase; color: var(--fg-3); margin-bottom: 4px;\">Strumienie materiałowe<\u002Fdiv>\n    <sc-for list=\"{{ legend }}\" as=\"lg\" hint-placeholder-count=\"6\">\n      <div onclick=\"{{ lg.pick }}\" style=\"display: flex; align-items: center; gap: 9px; margin-top: 6px; padding: 3px 6px; margin-left: -6px; margin-right: -6px; border-radius: 7px; cursor: pointer; opacity: {{ lg.op }}; background: {{ lg.bg }}; transition: opacity 160ms, background 160ms;\" style-hover=\"background: rgba(255,97,16,0.08);\">\n        <span style=\"width: 12px; height: 12px; border-radius: 3px; flex: 0 0 auto; background: {{ lg.color }};\"><\u002Fspan>\n        <span style=\"font-size: 12px; color: var(--fg-2);\">{{ lg.name }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n    <sc-if value=\"{{ hasFilter }}\" hint-placeholder-val=\"{{ false }}\">\n      <div onclick=\"{{ clearFilter }}\" style=\"margin-top: 10px; font-size: 11px; font-weight: 500; color: #FF6110; cursor: pointer; text-align: center; padding: 5px; border: 1px solid #FFA36B; border-radius: 999px;\" style-hover=\"background: rgba(255,97,16,0.08);\">Pokaż wszystkie strumienie<\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <!-- Panel informacyjny -->\n  <sc-if value=\"{{ hasSel }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position: absolute; left: 32px; bottom: 28px; width: 360px; max-width: calc(100vw - 64px); background: var(--bg-raised); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; box-shadow: 0 12px 36px rgba(17,16,19,0.14);\">\n      <button onclick=\"{{ close }}\" style=\"position: absolute; top: 10px; right: 12px; background: none; border: none; cursor: pointer; color: var(--fg-4); font-size: 16px; line-height: 1; padding: 4px; font-family: 'Space Grotesk', sans-serif;\" style-hover=\"color: var(--accent);\">✕<\u002Fbutton>\n      <div style=\"font-size: 10px; font-weight: 600; letter-spacing: 1.6px; text-transform: uppercase; color: var(--accent); margin-bottom: 6px;\">{{ selTag }}<\u002Fdiv>\n      <h2 style=\"margin: 0 0 6px; font-size: 16px; font-weight: 700; letter-spacing: -0.02em; color: var(--fg);\">{{ selName }}<\u002Fh2>\n      <p style=\"margin: 0; font-size: 12.5px; line-height: 1.55; color: var(--fg-2); text-wrap: pretty;\">{{ selDesc }}<\u002Fp>\n      <div style=\"margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 11.5px; line-height: 1.5; color: var(--fg-3);\"><b style=\"color: var(--fg); font-weight: 600;\">{{ selKvLabel }}<\u002Fb> {{ selKvRest }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- Podpowiedź -->\n  <div style=\"position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); font-size: 12px; color: var(--fg-3); background: var(--bg-raised); border: 1px solid var(--line); border-radius: 999px; padding: 7px 16px; pointer-events: none; white-space: nowrap;\">Przeciągnij = obrót · scroll = zoom · klik = szczegóły stacji<\u002Fdiv>\n\n  <!-- Sterowanie -->\n  <div style=\"position: absolute; right: 28px; bottom: 28px; display: flex; gap: 8px;\">\n    <button onclick=\"{{ toggleRot }}\" style=\"background: var(--bg-raised); border: 1px solid var(--line); border-radius: 999px; padding: 9px 16px; font-size: 12px; font-weight: 500; color: var(--fg); cursor: pointer; font-family: 'Space Grotesk', sans-serif; box-shadow: 0 2px 10px rgba(17,16,19,0.08); transition: border-color 160ms cubic-bezier(0.22,1,0.36,1);\" style-hover=\"border-color: var(--accent); color: var(--accent);\" style-active=\"transform: scale(0.98);\">{{ rotLabel }}<\u002Fbutton>\n    <button onclick=\"{{ resetView }}\" style=\"background: var(--bg-raised); border: 1px solid var(--line); border-radius: 999px; padding: 9px 16px; font-size: 12px; font-weight: 500; color: var(--fg); cursor: pointer; font-family: 'Space Grotesk', sans-serif; box-shadow: 0 2px 10px rgba(17,16,19,0.08); transition: border-color 160ms cubic-bezier(0.22,1,0.36,1);\" style-hover=\"border-color: var(--accent); color: var(--accent);\" style-active=\"transform: scale(0.98);\">Resetuj widok<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;darkMode&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Scena&quot; },\n  &quot;autoRotate&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Scena&quot; },\n  &quot;showLabels&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Scena&quot; },\n  &quot;showFlows&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Przepływy&quot; },\n  &quot;flowSpeed&quot;: { &quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 1, &quot;min&quot;: 0, &quot;max&quot;: 3, &quot;step&quot;: 0.1, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Przepływy&quot; }\n}\">\nclass Component extends DCLogic {\n  state = { sel: null, rotating: null, filter: null };\n\n  componentDidMount() {\n    this._onSel = (e) => this.setState({ sel: e.detail });\n    document.addEventListener('factory-select', this._onSel);\n  }\n  componentWillUnmount() {\n    document.removeEventListener('factory-select', this._onSel);\n  }\n\n  _setFilter(hex) {\n    this.setState({ filter: hex });\n    document.dispatchEvent(new CustomEvent('factory-cmd', {\n      detail: { cmd: 'filter', value: hex ? parseInt(hex.slice(1), 16) : null } }));\n  }\n\n  renderVals() {\n    const s = this.state.sel;\n    const rotating = this.state.rotating == null ? (this.props.autoRotate ?? true) : this.state.rotating;\n    const kv = s ? s.kv : '';\n    const ci = kv.indexOf(':');\n    return {\n      themeName: (this.props.darkMode ?? false) ? 'dark' : 'light',\n      legend: [\n        { color: '#6E7580', name: 'Ołów metaliczny (Pb)' },\n        { color: '#95122C', name: 'Pasta ołowiowa (PbSO₄)' },\n        { color: '#CA3F16', name: 'PbO (α/β) po ługowaniu' },\n        { color: '#D9A62E', name: 'Elektrolit H₂SO₄ (zawracany)' },\n        { color: '#4A7FB5', name: 'Tworzywo PP (regranulat)' },\n        { color: '#3F9C6B', name: 'Gotowe ogniwa KLAB' },\n      ].map(lg => {\n        const active = this.state.filter === lg.color;\n        return Object.assign({}, lg, {\n          op: this.state.filter && !active ? 0.35 : 1,\n          bg: active ? 'rgba(255,97,16,0.12)' : 'transparent',\n          pick: () => this._setFilter(active ? null : lg.color),\n        });\n      }),\n      hasFilter: !!this.state.filter,\n      clearFilter: () => this._setFilter(null),\n      hasSel: !!s,\n      selTag: s ? s.tag : '',\n      selName: s ? s.name : '',\n      selDesc: s ? s.desc : '',\n      selKvLabel: ci > -1 ? kv.slice(0, ci + 1) : '',\n      selKvRest: ci > -1 ? kv.slice(ci + 1).trim() : kv,\n      close: () => {\n        this.setState({ sel: null });\n        document.dispatchEvent(new CustomEvent('factory-cmd', { detail: { cmd: 'deselect' } }));\n      },\n      toggleRot: () => {\n        const v = !rotating;\n        this.setState({ rotating: v });\n        document.dispatchEvent(new CustomEvent('factory-cmd', { detail: { cmd: 'rotate', value: v } }));\n      },\n      rotLabel: rotating ? 'Zatrzymaj obrót' : 'Wznów obrót',\n      resetView: () => document.dispatchEvent(new CustomEvent('factory-cmd', { detail: { cmd: 'reset' } })),\n      autoRotateStr: String(this.props.autoRotate ?? true),\n      showLabelsStr: String(this.props.showLabels ?? true),\n      flowSpeedStr: String(this.props.flowSpeed ?? 1),\n      showFlowsStr: String(this.props.showFlows ?? true),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
